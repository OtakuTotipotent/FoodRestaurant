<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodRest. | Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-green-950 text-white">

  <nav class="w-full p-2 flex gap-5 justify-start bg-white text-green-800 font-semibold backdrop-blur-md">
    <a class="hover:text-green-950 py-1" href="/">Home</a>
    <a class="hover:text-green-950 py-1" href="/cart">Cart</a>
    <a class="hover:text-green-950 py-1" href="/admin">Admin</a>
  </nav>

  <section class="w-full flex items-center justify-center">
    <h1 class="p-4 rounded-md shadow-sm shadow-white my-4">Administration privileges granted!</h1>
  </section>

  <section class="bg-gray-700/50 backdrop-blur-md max-w-3xl m-auto my-4 rounded-xl p-4">
    <h2 class="text-center uppercase font-bold text-green-500">Add an item to <span>FoodRest.</span></h2>
    <form action="/admin/cart/add" method="post" class="my-4 p-1 md:p-4 grid gap-5 sm:grid-cols-2">
      <input class="bg-green-950 text-gray-300 placeholder:text-green-500 border-none outline-none px-3 py-2 rounded-md"
        type="text" name="name" id="name" placeholder="Enter the name of item" required>
      <input
        class="bg-green-950 text-gray-300 placeholder:text-green-500 border-none outline-none px-3 py-2 rounded-md appearance-none [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
        type="number" name="price" id="price" placeholder="Enter price for this item" required>
      <input
        class="bg-green-950 text-gray-300 placeholder:text-green-500 border-none outline-none px-3 py-2 rounded-md appearance-none [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
        type="number" name="quantity" id="quantity" placeholder="Enter available quantity for this item" required>

      <select name="size" id="size" class="bg-green-950 text-green-500 border-none outline-none px-3 py-2 rounded-md"
        required>
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
        <option value="extra">Extra Large</option>
      </select>

      <button type="submit"
        class="bg-green-600/50 text-green-200 rounded-md p-1.5 uppercase font-bold leading-loose tracking-wide hover:bg-green-500/50">Save
        Item</button>
    </form>
  </section>

</body>

</html>
